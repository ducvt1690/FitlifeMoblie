$kind: http-request
name: '02 — Me (cần 200)'
method: GET
url: '{{baseUrl}}/api/auth/me'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{manualAuthToken}}'
scripts:
  - type: beforeRequest
    code: |-
      if (!/^[A-Za-z0-9_-]{43}$/.test(pm.environment.get('manualAuthToken') || '')) {
        if (pm.execution && pm.execution.skipRequest) pm.execution.skipRequest();
        throw new Error('Bấm Send ở 01 Login thành công trước. Nếu vừa Logout, cần Login lại.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Me trả 200', function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test('Đúng tài khoản vừa đăng nhập', function () {
        pm.expect(Boolean(body.success && body.user && body.user.user_id === pm.environment.get('manualAuthUserId'))).to.eql(true);
      });
      if (pm.response.code === 401) {
        pm.environment.unset('manualAuthToken');
        pm.environment.unset('manualAuthUserId');
      }
    language: text/javascript
