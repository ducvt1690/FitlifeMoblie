$kind: http-request
name: '03 — Logout (cần 204)'
method: POST
url: '{{baseUrl}}/api/auth/logout'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{manualAuthToken}}'
scripts:
  - type: beforeRequest
    code: |-
      if (!/^[A-Za-z0-9_-]{43}$/.test(pm.environment.get('manualAuthToken') || '')) {
        if (pm.execution && pm.execution.skipRequest) pm.execution.skipRequest();
        throw new Error('Chưa có phiên để đăng xuất. Bấm Send ở 01 Login trước.');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Logout trả 204', function () { pm.response.to.have.status(204); });
      pm.test('Không có response body', function () { pm.expect(pm.response.text()).to.eql(''); });
      if (pm.response.code === 204) {
        pm.environment.unset('manualAuthToken');
        pm.environment.unset('manualAuthUserId');
      }
    language: text/javascript
