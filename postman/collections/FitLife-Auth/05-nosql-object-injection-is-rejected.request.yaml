$kind: http-request
name: "05 — NoSQL object injection is rejected [expected 400]"
method: POST
url: "{{baseUrl}}/api/auth/login"
order: 5000
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {"email":{"$ne":null},"password":{"$ne":null}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
