$kind: http-request
name: "04 — Malformed JSON is rejected [expected 400]"
method: POST
url: "{{baseUrl}}/api/auth/login"
order: 4000
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {"email":
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
